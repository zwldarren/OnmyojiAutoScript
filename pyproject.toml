[project]
name = "onmyojiautoscript"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2.12.0",
    "anytree>=2.13.0",
    "cn2an>=0.5.23",
    "cryptography>=46.0.3",
    "fastapi>=0.121.3",
    "filelock>=3.20.0",
    "inflection>=0.5.1",
    "lxml>=6.0.2",
    "numpy>=2.2.6",
    "oashya>=0.0.7",
    "onepush>=1.7.0",
    "opencv-python>=4.12.0.88",
    "paho-mqtt>=2.1.0",
    "ppocr-onnx>=0.0.3.9",
    "psutil>=7.1.3",
    "pydantic>=2.12.4",
    "pywin32>=311",
    "pyyaml>=6.0.3",
    "retry>=0.9.2",
    "rich>=14.2.0",
    "tqdm>=4.67.1",
    "uiautomator2>=3.5.0",
    "uiautomator2cache>=0.3.1",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
    "wrapt>=2.0.1",
    "zerorpc>=0.6.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "lxml-stubs>=0.5.1",
    "ruff>=0.14.5",
]

[tool.ruff]
line-length = 100
exclude = [
    "tasks/*/assets.py",
    "dev_tools/**",
    "deploy/**",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = [
    "E501",  # line too long
]

[tool.pyright]
typeCheckingMode = "basic"
exclude = [
    "tasks/*/assets.py",
    "config/**",
    "bin/**",
    "fluentui/**",
    "*.pyi",
    "**/__pycache__/**",
    ".venv/**",
]
